    <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#9b9c6b"/><stop offset=".47" stop-color="#b2b380"/><stop offset="1" stop-color="#8b8e5e"/></linearGradient>
    <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 1h1M4 5h1" stroke="#52603b" stroke-opacity=".045" stroke-width=".6"/></pattern>
