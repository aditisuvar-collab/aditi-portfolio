<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A little green, a lot of joy</title>
  <desc id="desc">An original editorial illustration of a botanical gift label, an olive ribbon and a round paper seal on a pale sage surface.</desc>
